name: ChurnGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Ruff lint
        run: python -m ruff check api modeling monitoring ui tests scripts
      - name: Pytest
        run: python -m pytest -q
      - name: Syntax compilation
        run: python -m compileall -q api modeling monitoring ui scripts
