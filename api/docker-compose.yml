Test the same workflow you used before: sign in, enter a customer, get a prediction, upload your Telco CSV and check the Monitoring page.

### Useful Docker commands

```cmd
docker compose logs --tail=60 api
docker compose logs --tail=60 ui
```

To restart:

```cmd
docker compose restart
```

To stop:

```cmd
docker compose down
```

To rebuild after code changes:

```cmd
docker compose up -d --build
```

**Do not use `docker compose down -v` unless you intentionally want to delete the persistent monitoring volume.**

We have now defined a repeatable local deployment configuration. It still needs to run successfully on your machine before we can mark Dockerization as verified.

