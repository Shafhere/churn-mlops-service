
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: churnguard-api:local
    restart: unless-stopped

    env_file:
      - .env

    environment:
      CHURNGUARD_MONITOR_DB_DIR: /app/runtime

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./artifacts:/app/artifacts:ro
      - monitoring-data:/app/runtime

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    image: churnguard-ui:local
    restart: unless-stopped

    env_file:
      - .env

    environment:
      CHURNGUARD_API_URL: http://api:8000

    ports:
      - "127.0.0.1:8501:8501"

    depends_on:
      api:
        condition: service_healthy

volumes:
  monitoring-data:
```

### Understand Docker Compose

| Component | Purpose |
|---|---|
| `api` | Runs the trained prediction service |
| `ui` | Runs Streamlit |
| `env_file` | Supplies runtime configuration and secrets from local `.env` |
| `http://api:8000` | Allows Streamlit to reach FastAPI using Docker service networking |
| `artifacts:ro` | Lets the API read model files without modifying them |
| `monitoring-data` | Keeps monitoring counters and drift statistics across normal restarts |
| `healthcheck` | Checks whether FastAPI responds successfully |
| `depends_on` | Starts Streamlit after the API becomes healthy |

Docker Compose supports health-based startup dependencies and persistent named volumes. <Cite refs={["turn520337search7","turn520337search21"]}/>

The `127.0.0.1` port bindings are deliberate. **For now, these services are accessible from your computer only**, not the public internet. We'll design public HTTPS access during AWS deployment.

Keep your `.env` private. It should include the API key, UI password and local API URL you configured in Part 2. Docker Compose overrides the UI's API URL internally to `http://api:8000`.

