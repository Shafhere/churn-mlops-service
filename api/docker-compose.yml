# Step 8 — GitHub Actions: Automated Testing and Code Quality

Now let's set up CI (Continuous Integration).

**What is CI?** Whenever we push changes to GitHub, GitHub Actions will automatically install dependencies, check our Python code and run automated tests.

This is important because code that works on your laptop might fail on another machine. CI helps detect those problems early. GitHub provides official support for Python testing and linting workflows. <Cite ref="turn163261search2"/>

## 8.1 Install Ruff

Ruff checks Python code for common errors, unused imports and other quality issues.

In Command Prompt:

```cmd
python -m pip install ruff==0.17.6
```

Run:

```cmd
ruff check api modeling monitoring ui tests
```

Then:

```cmd
python -m pytest -q
```

If Ruff reports issues, review and correct them. For straightforward automatically fixable issues, you can run:

```cmd
ruff check api modeling monitoring ui tests --fix
```

Check the changed code and rerun the tests. We won't disable checks merely to make CI appear successful.

## 8.2 Create the GitHub Actions workflow

Create this folder if it does not exist:

```cmd
mkdir .github\workflows
```

Create `.github/workflows/ci.yml`:

<CodeBlock language="yaml" editable>
name: ChurnGuard CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ruff==0.17.6

      - name: Check code quality
        run: ruff check api modeling monitoring ui tests

      - name: Run automated tests
        run: python -m pytest -q
