# Step 7 — Build and Run Docker

Stop your manually running FastAPI and Streamlit terminals first using `Ctrl + C`. Otherwise, ports 8000 and 8501 may already be occupied.

In Command Prompt:

### 7.1 Validate the Compose file

```cmd
docker compose config --quiet
```

This should complete without errors.

### 7.2 Build both images

```cmd
docker compose build
```

### 7.3 Start both containers

```cmd
docker compose up -d
```

### 7.4 Check container status

```cmd
docker compose ps
```

Expected structure:

```text
NAME                   SERVICE   STATUS
churn-mlops-service-api-1  api    Up (healthy)
churn-mlops-service-ui-1   ui     Up
```

The exact container names may differ.

### 7.5 Open your application

